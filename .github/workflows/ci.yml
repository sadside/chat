name: CI/CD

# Runs automatically on every push / PR — GitHub Actions is enabled by
# default, so this file is all that's needed. Nothing to connect or configure.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Stage 1: Frontend — lint, type-check, unit tests, production build ──────
  frontend:
    name: 🎨 Frontend · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build (Vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Stage 1 (parallel): Backend — pytest against a real Postgres ───────────
  backend:
    name: ⚙️ Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nova:nova@localhost:5432/nova
      JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
      OTP_PEPPER: ci-test-otp-pepper
      SMTP_FROM: noreply@nova.local
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests (pytest)
        run: uv run pytest -v

  # ── Stage 2: Package — build the Docker images (containerization gate) ──────
  docker:
    name: 🐳 Package · docker build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: nova-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (production target)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          build-args: VITE_API_URL=https://nova.example.com/api/v1
          push: false
          tags: nova-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Summary gate — one green check that means "everything passed" ──────────
  ci-passed:
    name: ✅ CI passed
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker]
    steps:
      - run: echo "All stages green — frontend, backend, and Docker images built."
