name: filebeat

filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: false
      templates:
        - condition:
            contains:
              docker.container.labels.logging: elk
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - drop_fields:
                    fields: ["message"]
                    ignore_missing: true

processors:
  - add_host_metadata: ~

output.logstash:
  hosts: ["logstash:5044"]

http:
  enabled: true
  host: 0.0.0.0
